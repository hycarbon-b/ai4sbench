{% extends "notification.html" %}
{% block message %}
<p style="margin:0;color:#33435B;font-size:15px;line-height:25px;">Enter this code to {{ action }}: <strong style="color:#0D1730;font-size:22px;letter-spacing:0.15em;white-space:nowrap;">{{ code }}</strong>. It expires in 10 minutes. If you did not request it, you can ignore this email.</p>
{% endblock %}
