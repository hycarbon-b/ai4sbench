<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ subject }}</title>
  </head>
  <body style="margin:0;padding:0;background-color:#F7F9FC;color:#0D1730;font-family:Inter,Arial,Helvetica,sans-serif;">
    <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%" style="border-collapse:collapse;background-color:#F7F9FC;">
      <tr>
        <td align="center" style="padding:36px 16px;">
          <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%" style="width:100%;max-width:600px;border-collapse:collapse;background-color:#FFFFFF;border:1px solid #DDE5F0;">
            <tr>
              <td style="padding:22px 30px;background-color:#0D1730;color:#FFFFFF;font-size:16px;line-height:24px;font-weight:700;letter-spacing:0.01em;">AI4S<span style="color:#18B7C9;">-</span>Bench</td>
            </tr>
            <tr>
              <td style="height:3px;font-size:0;line-height:0;background-color:#2474FF;">&nbsp;</td>
            </tr>
            <tr>
              <td style="padding:34px 30px 38px;">
                <h1 style="margin:0 0 20px;color:#0D1730;font-size:23px;line-height:31px;font-weight:600;">{{ heading }}</h1>
                {% block message %}{% endblock %}
              </td>
            </tr>
            <tr>
              <td style="padding:18px 30px;border-top:1px solid #DDE5F0;color:#62718A;font-size:12px;line-height:18px;">AI4S-Bench</td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
