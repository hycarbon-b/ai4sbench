<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none" role="img" aria-label="AI4S-Benchmark orbit mark">
  <!-- Outer orbit: solid arc with a gap at lower-left -->
  <path d="M 21.9 82 A 44 44 0 1 1 41.4 99.9" stroke="#0D1730" stroke-width="3" stroke-linecap="round"/>
  <!-- Inner orbit: dashed ellipse -->
  <ellipse cx="60" cy="60" rx="29" ry="16" transform="rotate(-30 60 60)" stroke="#0D1730" stroke-width="1.6" stroke-dasharray="4 5" stroke-linecap="round"/>
  <!-- Rod from open terminal to satellite -->
  <path d="M 32.2 88.7 L 92 27" stroke="#0D1730" stroke-width="3" stroke-linecap="round"/>
  <!-- Nucleus -->
  <circle cx="60" cy="60" r="12.5" fill="#0D1730"/>
  <!-- Satellite (electric blue) -->
  <circle cx="92" cy="27" r="7.5" fill="#2474FF"/>
  <!-- Open terminal -->
  <circle cx="28" cy="93" r="6" stroke="#0D1730" stroke-width="3" fill="none"/>
  <!-- Accent bodies on the outer orbit -->
  <circle cx="16" cy="52" r="5" fill="#18B7C9"/>
  <circle cx="92" cy="92" r="5" fill="#7E8AA3"/>
  <!-- Distant bodies -->
  <circle cx="26" cy="22" r="2.5" fill="#0D1730"/>
  <circle cx="16" cy="32" r="2" fill="#0D1730"/>
</svg>
