name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard-frontend/frontend/package-lock.json
      - run: python scripts/ci.py
      - name: Upload backend documentation build
        uses: actions/upload-artifact@v4
        with:
          name: backend-docs
          path: backend/dist/docs/
          if-no-files-found: error
